# Optional: Zabbix Agent 2 on a monitored Linux host (Docker).
#
# All host-specific values live in .env (single source of truth). Set there:
#   ZBX_HOSTNAME     - unique name, must match the host created in the Zabbix UI
#   ZBX_SERVER_HOST  - IP/DNS of the server, reachable from this agent (port 10051)
#   ZBX_IMAGE_TAG    - optional, defaults to alpine-7.4-latest
#
# Then, from the directory containing .env:
#   docker compose -f docker-compose.agent.yml up -d
# (Compose auto-loads .env from the working directory — no extra flags needed.)
#
# This file is identical on every monitored host; only .env differs per host.

services:
  zabbix-agent2:
    image: zabbix/zabbix-agent2:${ZBX_IMAGE_TAG:-alpine-7.4-latest}
    restart: unless-stopped
    privileged: true
    pid: host
    ports:
      - "10050:10050"
    environment:
      ZBX_HOSTNAME: ${ZBX_HOSTNAME:-change-to-unique-hostname}
      ZBX_SERVER_HOST: ${ZBX_SERVER_HOST:-zabbix.example.com}
      ZBX_SERVER_PORT: "10051"
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_PASSIVE_ALLOW: "true"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /:/hostfs:ro
      - /var/run:/var/run:ro
    tmpfs:
      - /tmp
