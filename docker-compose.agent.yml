# Zabbix Agent 2 for a monitored Linux host — ACTIVE checks only.
#
# This file is IDENTICAL on every monitored host; only .env differs.
# In .env set:
#   ZBX_SERVER_HOST  - IP/DNS of the Zabbix server, reachable on 10051 from this host
#   ZBX_METADATA     - autoregistration tag the server matches on (default: linux)
#   ZBX_HOSTNAME     - leave empty to auto-use this machine's system hostname
#   ZBX_IMAGE_TAG    - optional, defaults to alpine-7.4-latest
#
# Deploy (from the directory containing .env):
#   docker compose -f docker-compose.agent.yml up -d
#
# Active-only means: the agent connects OUT to the server (no inbound 10050),
# so the same config works for local, remote, and NAT'd hosts. New hosts are
# created automatically via an autoregistration action in the Zabbix UI.

services:
  zabbix-agent2:
    image: zabbix/zabbix-agent2:${ZBX_IMAGE_TAG:-alpine-7.4-latest}
    restart: unless-stopped
    privileged: true
    pid: host
    uts: host          # share host UTS namespace so system.hostname = real host name
    environment:
      ZBX_HOSTNAME: ${ZBX_HOSTNAME:-}                              # empty => use system hostname
      ZBX_SERVER_HOST: ${ZBX_SERVER_HOST:?Set ZBX_SERVER_HOST in .env}
      ZBX_SERVER_PORT: "10051"
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_PASSIVE_ALLOW: "false"
      ZBX_METADATA: ${ZBX_METADATA:-linux}                         # matched by the autoreg action
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /:/hostfs:ro
      - /var/run:/var/run:ro
    tmpfs:
      - /tmp
